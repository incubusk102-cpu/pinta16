name: Deploy to Cloudflare Pages

# Builds the Vite frontend and publishes the `dist/` output to the
# `canvhub` Cloudflare Pages project via direct upload. This bypasses
# the Cloudflare Pages git integration so we have full control over
# the build (correct Node version, npm install, vite build) and the
# deployed site always serves the bundled assets in `dist/` rather
# than the raw source tree.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   - CANVHUB_PAGES_DEPLOY
#       Cloudflare API token. Must include the "Cloudflare Pages — Edit"
#       permission for the account that owns the `canvhub` project.
#       Create at: https://dash.cloudflare.com/profile/api-tokens
#       (use the "Edit Cloudflare Pages" template).
#   - CLOUDFLARE_ACCOUNT_ID
#       Your Cloudflare account ID. Find it on the right sidebar of any
#       page at https://dash.cloudflare.com/
#
# Optional GitHub repo secrets (source-map upload to Sentry):
#   - SENTRY_AUTH_TOKEN
#       Sentry auth token with `project:releases` + `org:read` scopes.
#       Create at: https://sentry.io/settings/account/api/auth-tokens/
#       (or use an Internal Integration token). When unset, the build
#       still succeeds — `@sentry/vite-plugin` becomes a no-op and source
#       maps are not emitted. See docs/observability-setup.md.
#
# Optional GitHub repo secrets (inlined into the SPA bundle at build time):
#   - VITE_SENTRY_DSN
#       Public Sentry DSN. Vite inlines this into the bundle so the
#       browser SDK can send events. Set this here — NOT in the
#       Cloudflare Pages env vars — because the build runs inside this
#       workflow, not inside the Pages git integration, so Pages env
#       vars never reach `npm run build`. When unset, `Sentry.init` is
#       skipped entirely (lazy import in `src/lib/observability.ts`
#       bails when the DSN is empty).
#   - VITE_CF_ANALYTICS_TOKEN
#       Cloudflare Web Analytics site token. Same reasoning as the
#       Sentry DSN — it has to be available at build time, not just
#       at runtime, because Vite inlines it. When unset, the beacon
#       script is never injected.
#   - VITE_TURNSTILE_SITE_KEY
#       Public Cloudflare Turnstile site key (the value Cloudflare
#       shows next to your widget at
#       https://dash.cloudflare.com/?to=/:account/turnstile, starting
#       `0x4AAAAA...`). Inlined into the SPA bundle so the checkout,
#       newsletter, and admin-login Turnstile widgets can call
#       `window.turnstile.render({ sitekey, ... })`. Same reasoning as
#       the Sentry DSN — must live here, not in Pages env vars,
#       because Vite needs it at build time. When unset,
#       `isTurnstileEnabled()` in `src/components/Turnstile.tsx`
#       returns `false`, the widget renders nothing, and the
#       client-side gate is bypassed (the server still requires a
#       valid token, so every payment-intent call fails with
#       "Verification failed"). The site key is public-safe — it ships
#       in every visitor's HTML — pair it with the `TURNSTILE_SECRET_KEY`
#       runtime secret in Cloudflare Pages for the server-side check.
#   - VITE_SENTRY_ENVIRONMENT
#       Optional environment label. Defaults to the Vite build mode
#       (`production`). Set to differentiate e.g. preview deploys.
#   - VITE_SENTRY_TRACES_SAMPLE_RATE
#       Optional. Float between 0 and 1. Defaults to 0.1.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          # When SENTRY_AUTH_TOKEN is configured, the Vite build emits
          # hidden source maps and `@sentry/vite-plugin` uploads them to
          # Sentry as part of a release tagged with the commit SHA. When
          # the secret is missing, both behaviors silently no-op.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          # Inlined into the SPA bundle so `Sentry.init({ dsn, release })`
          # can actually send events tagged with the commit SHA. All four
          # values are public — DSNs and release IDs are designed to be
          # visible in the bundle. When VITE_SENTRY_DSN is empty the SDK
          # never initializes (lazy import bails).
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ secrets.VITE_SENTRY_ENVIRONMENT }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Cloudflare Web Analytics token — also inlined at build time,
          # so it must live here rather than in Pages env vars.
          VITE_CF_ANALYTICS_TOKEN: ${{ secrets.VITE_CF_ANALYTICS_TOKEN }}
          # Cloudflare Turnstile site key — public-safe and inlined into
          # the SPA bundle so the checkout, newsletter, and admin-login
          # widgets can render. Must live here (not in Pages env vars)
          # because Vite needs it at `npm run build` time, not at
          # runtime. When the secret is unset, the build still succeeds
          # — `isTurnstileEnabled()` just returns `false` and the
          # widgets render nothing.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CANVHUB_PAGES_DEPLOY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist
            --project-name=canvhub
            --branch=${{ github.head_ref || github.ref_name }}
