name: Bootstrap KV namespaces

# One-shot workflow to create the Cloudflare KV namespaces declared in
# wrangler.toml and rewrite the placeholder IDs (REPLACE_WITH_*_KV_ID,
# REPLACE_WITH_*_KV_PREVIEW_ID) with the real namespace IDs returned by
# Cloudflare. Opens a PR with the resulting wrangler.toml change.
#
# Trigger manually via Actions → "Bootstrap KV namespaces" → Run workflow.
#
# Requires the existing repo secrets:
#   - CLOUDFLARE_API_TOKEN (must include Workers KV Storage → Edit)
#   - CLOUDFLARE_ACCOUNT_ID
#
# Safe to run multiple times: it only creates a namespace if the
# corresponding placeholder still exists in wrangler.toml.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save wrangler@3

      - name: Create KV namespaces and rewrite wrangler.toml
        run: node .github/scripts/bootstrap-kv.mjs

      - name: Show diff
        run: git --no-pager diff -- wrangler.toml || true

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Replace KV namespace placeholders in wrangler.toml with real IDs"
          title: "Bootstrap Cloudflare KV namespaces"
          body: |
            Automated PR opened by the **Bootstrap KV namespaces** workflow.

            Replaces the `REPLACE_WITH_*_KV_ID` and `REPLACE_WITH_*_KV_PREVIEW_ID`
            placeholders in `wrangler.toml` with the IDs of newly-created
            Cloudflare KV namespaces. Once merged, the `Deploy to Cloudflare Pages`
            workflow should succeed and canvhub.com should render the real site.

            Created namespaces are listed in the workflow run summary.
          branch: bot/bootstrap-kv-namespaces
          base: main
          delete-branch: true
          add-paths: wrangler.toml
