# ---------------------------------------------------------------------------
# SECURITY_CONFIG
#
# Backs the Admin → Security panel: per-endpoint rate limits, Turnstile mode
# (off / soft / hard), body-size cap (1–10 MB), and IP block list. When this
# binding is missing, every helper falls back to the hardcoded defaults that
# match the values shipped in #204 / #206. With the binding present (below),
# the panel reads the live overrides from KV and Save buttons start working.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SECURITY_CONFIG"
id = "89358933447747e58dee7f7e53dcf999"
preview_id = "e717d43c38a64b8bb4efc387710620a7"

# ---------------------------------------------------------------------------
# R2 bucket binding (optional)
#
# When this binding is present, admin product photo uploads write to R2
# instead of returning a base64 data URL stuffed into KV. The free tier
# (10 GB stored, $0 egress) covers a small gallery indefinitely.
#
# To enable in production:
#   1. Create the bucket in the Cloudflare dashboard:
#      Workers & Pages → R2 → Create bucket → name `canvhub-uploads`
#   2. Bind it to the Pages project:
#      Workers & Pages → canvhub → Settings → Functions → R2 bucket bindings
#      Variable name: UPLOADS_BUCKET   Bucket: canvhub-uploads
#   3. Uncomment the block below and `git push` (CI redeploys with the
#      binding active). Until step 2 is done, the upload endpoint
#      returns 503 and the admin upload UI falls back to the existing
#      base64 path — so this PR is safe to merge before R2 is created.
#
# [[r2_buckets]]
# binding = "UPLOADS_BUCKET"
# bucket_name = "canvhub-uploads"
# preview_bucket_name = "canvhub-uploads-preview"
