# ---------------------------------------------------------------------------
# SECURITY_CONFIG
#
# Backs the Admin → Security panel: per-endpoint rate limits, Turnstile mode
# (off / soft / hard), body-size cap (1–10 MB), and IP block list. When this
# binding is missing, every helper falls back to the hardcoded defaults that
# match the values shipped in #204 / #206. With the binding present (below),
# the panel reads the live overrides from KV and Save buttons start working.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SECURITY_CONFIG"
id = "89358933447747e58dee7f7e53dcf999"
preview_id = "e717d43c38a64b8bb4efc387710620a7"

# ---------------------------------------------------------------------------
# SECURITY_EVENTS (optional)
#
# Stores time-bucketed threat events (scanner probes, CSRF blocks, path
# traversal attempts, rate-limit denials, IP blocks) and rolling aggregate
# stats surfaced in Admin → Security → Threat Dashboard. Hourly buckets
# auto-expire after 7 days to keep the namespace tidy. Also stores the
# auto-ban configuration (threshold + window).
#
# To enable in production:
#   1. Create the namespace in the Cloudflare dashboard:
#      Workers & Pages → KV → Create namespace → name `SECURITY_EVENTS`.
#      Then create a second namespace for preview (e.g. `SECURITY_EVENTS_PREVIEW`).
#   2. Paste the production + preview IDs below and uncomment the block.
#   3. `git push` (CI redeploys with the binding active).
#
# Until the binding exists, the threat dashboard renders with empty data
# and a "binding not bound" warning, and `logSecurityEvent` is a no-op —
# so the rest of the API keeps working unchanged.
#
# Same namespace is used for both production and preview because the
# canvhub Pages project doesn't really exercise the preview environment;
# split into two namespaces later if previews start carrying real data.
[[kv_namespaces]]
binding = "SECURITY_EVENTS"
id = "67c757b425ee427b9c9bba0a16519ff7"
preview_id = "67c757b425ee427b9c9bba0a16519ff7"

# ---------------------------------------------------------------------------
# ABANDONED_CARTS (optional)
#
# Stores cart snapshots synced when a shopper enters their email at
# checkout but never completes payment. A scheduled GitHub Action calls
# POST /api/abandoned-cart/process every 30 minutes; it finds carts older
# than 1 h (first nudge) and 24 h (final nudge), sends a branded recovery
# email, then marks the entry so it isn't re-sent. Entries auto-expire
# after 7 days via KV TTL.
#
# To enable in production:
#   1. Create the namespace in the Cloudflare dashboard:
#      Workers & Pages → KV → Create namespace → name `canvhub-abandoned-carts`.
#      Then create a second namespace for preview.
#   2. Paste the production + preview IDs below and uncomment the block.
#   3. `git push` (CI redeploys with the binding active).
#
# Until the binding exists, the sync endpoint returns 503 and the cron
# is a no-op — the storefront keeps working unchanged.
#
# [[kv_namespaces]]
# binding = "ABANDONED_CARTS"
# id = "REPLACE_WITH_PRODUCTION_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# D1 database binding (hybrid KV+SQL architecture)
#
# D1 is a managed SQLite database that runs on the same Cloudflare edge as
# this Pages deployment. It coexists with KV: KV remains the source of truth
# for fast public reads (products, config, hero slides); D1 enables SQL
# queries, JOINs, and aggregations for the admin panel (analytics, CRM,
# inventory reports).
#
# Free tier: 5 GB storage, 5 million reads/day, 100k writes/day — more than
# enough for canvhub's traffic at any realistic scale.
#
# To enable:
#   1. Create the database in the Cloudflare dashboard:
#      Workers & Pages → D1 → Create database → name: `canvhub`
#   2. Copy the Database ID and paste it below.
#   3. Run the migration:  npx wrangler d1 migrations apply canvhub
#   4. Add the D1 binding in Cloudflare Pages dashboard:
#      Workers & Pages → canvhub → Settings → Functions → D1 database bindings
#      Variable name: DB   Database: canvhub
#   5. `git push` (CI redeploys with the binding active).
#
# Until the binding exists, all D1 helpers gracefully return null/no-op —
# the site keeps working exactly as before on KV alone.
#
[[d1_databases]]
binding = "DB"
database_name = "canvhub"
database_id = "68b3022d-91ff-4847-9412-a8cce8bdd508"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 bucket binding (optional)
#
# When this binding is present, admin product photo uploads write to R2
# instead of returning a base64 data URL stuffed into KV. The free tier
# (10 GB stored, $0 egress) covers a small gallery indefinitely.
#
# To enable in production:
#   1. Create the bucket in the Cloudflare dashboard:
#      Workers & Pages → R2 → Create bucket → name `canvhub-uploads`
#   2. Bind it to the Pages project:
#      Workers & Pages → canvhub → Settings → Functions → R2 bucket bindings
#      Variable name: UPLOADS_BUCKET   Bucket: canvhub-uploads
#   3. Uncomment the block below and `git push` (CI redeploys with the
#      binding active). Until step 2 is done, the upload endpoint
#      returns 503 and the admin upload UI falls back to the existing
#      base64 path — so this PR is safe to merge before R2 is created.
#
# [[r2_buckets]]
# binding = "UPLOADS_BUCKET"
# bucket_name = "canvhub-uploads"
# preview_bucket_name = "canvhub-uploads-preview"

# ---------------------------------------------------------------------------
# Workers AI binding (used by the Turso vector-search "More like this" rail)
#
# Powers `_lib/embeddings.js` — generates 768-dim text embeddings via
# `@cf/baai/bge-base-en-v1.5` (free up to 10k Neurons/day, more than enough
# for embedding a few hundred paintings + the occasional admin re-run).
#
# When this binding is missing, the admin "Generate embeddings" button
# returns a 503 explaining how to enable it; the public similar-paintings
# endpoint silently returns `{ available: false, similar: [] }` and the
# product page falls back to its existing rule-based "You might also like"
# section.
#
# To enable: add a Workers AI binding in
#   Workers & Pages → canvhub → Settings → Functions → Workers AI bindings
#   Variable name: AI
# Then `git push` to redeploy with the binding active.
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Turso (libSQL) — vector search ONLY
#
# Turso is the *only* exception to the "no new database engine" rule in
# AGENTS.md, and it exists to host a single feature: native vector
# similarity search for the "More like this" rail on the product page.
# Everything else (orders, customers, products, config, …) still goes
# through KV (source of truth) + D1 (relational mirror).
#
# Turso is bound via plain environment variables, not a wrangler.toml
# binding, because the libSQL HTTP client (`_lib/turso.js`) talks over
# HTTPS — there is no native Pages binding for it.
#
# To enable in production:
#   1. Create the database at https://turso.tech (free tier covers
#      canvhub indefinitely): Dashboard → Create database → name `canvhub`,
#      region closest to PH (e.g. `aws-ap-southeast-1` Singapore).
#   2. Generate an auth token: Tokens tab → Create Token → Full access.
#   3. Add both to Cloudflare Pages → Settings → Environment variables:
#        TURSO_DATABASE_URL  (plaintext) — e.g. libsql://canvhub-XXXX.turso.io
#        TURSO_AUTH_TOKEN    (encrypted) — long JWT starting with `eyJ…`
#   4. `git push` (CI redeploys with the env vars active).
#   5. In `/admin → Vector Search (Turso)` panel: click "Apply schema"
#      then "Generate embeddings" to populate the index.
#
# Until the env vars are set, every Turso helper is a no-op — the site
# keeps working unchanged on KV+D1 alone.
