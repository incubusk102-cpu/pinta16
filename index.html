<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Canvas Hub — Affordable Art Gallery</title>
    <meta
      name="description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvas Hub" />
    <meta property="og:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      property="og:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:url" content="https://canvhub.com/" />
    <meta property="og:image" content="https://canvhub.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      name="twitter:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta name="twitter:image" content="https://canvhub.com/icon-512.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Canvas Hub" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts — preconnect to start the TLS handshake to
         fonts.gstatic.com in parallel with the HTML download, then
         load the stylesheet. Previously imported via an @import inside
         the Tailwind-built stylesheet, which serialises behind the CSS
         download. `display=swap` keeps text legible while the woff2s
         load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- Structured data for Google. `<script type="application/ld+json">`
         is treated as data, not script, by browsers, so it is not
         subject to `script-src` CSP enforcement. Two top-level entities:
           - Organization: who runs the site, contact, country.
           - WebSite:      site search box on Google SERPs.
         Per-page schema (Product, BreadcrumbList) is emitted by the
         relevant route components. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://canvhub.com/#organization",
            "name": "Canvas Hub",
            "url": "https://canvhub.com/",
            "logo": "https://canvhub.com/icon-512.png",
            "image": "https://canvhub.com/icon-512.png",
            "description": "Hand-crafted paintings and original art shipped from the Philippines, made to order.",
            "email": "support@canvhub.com",
            "areaServed": "PH",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PH"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@canvhub.com",
              "availableLanguage": ["English", "Filipino"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://canvhub.com/#website",
            "url": "https://canvhub.com/",
            "name": "Canvas Hub",
            "publisher": { "@id": "https://canvhub.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
