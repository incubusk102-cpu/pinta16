<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Canvas Hub — Affordable Art Gallery</title>
    <meta
      name="description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvas Hub" />
    <meta property="og:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      property="og:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:url" content="https://canvhub.com/" />
    <meta property="og:image" content="https://canvhub.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      name="twitter:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta name="twitter:image" content="https://canvhub.com/icon-512.png" />

    <!-- Default canonical for the homepage. Per-route canonicals are
         emitted by the `useSEO` hook in src/hooks/useSEO.ts and replace
         this href as soon as the SPA mounts; the static href below is
         what non-JS crawlers (e.g. social-link unfurlers) see when
         fetching the bare HTML document. -->
    <link rel="canonical" href="https://canvhub.com/" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Canvas Hub" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts — preconnect to start the TLS handshake to
         fonts.gstatic.com in parallel with the HTML download, then
         load the stylesheet. Previously imported via an @import inside
         the Tailwind-built stylesheet, which serialises behind the CSS
         download. `display=swap` keeps text legible while the woff2s
         load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- Structured data for Google. `<script type="application/ld+json">`
         is treated as data, not script, by browsers, so it is not
         subject to `script-src` CSP enforcement. Two top-level entities:
           - Organization: who runs the site, contact, country.
           - WebSite:      site search box on Google SERPs.
         Per-page schema (Product, BreadcrumbList) is emitted by the
         relevant route components. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://canvhub.com/#organization",
            "name": "Canvas Hub",
            "url": "https://canvhub.com/",
            "logo": "https://canvhub.com/icon-512.png",
            "image": "https://canvhub.com/icon-512.png",
            "description": "Hand-crafted paintings and original art shipped from the Philippines, made to order.",
            "email": "support@canvhub.com",
            "areaServed": "PH",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PH"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@canvhub.com",
              "availableLanguage": ["English", "Filipino"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://canvhub.com/#website",
            "url": "https://canvhub.com/",
            "name": "Canvas Hub",
            "publisher": { "@id": "https://canvhub.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Static boot fallback. Visible immediately on every load so visitors
         never see a totally blank page while the SPA is downloading or if
         the SPA fails to mount. React replaces this content the moment
         `createRoot(...).render()` runs in `src/main.tsx`. The styling is
         deliberately inline / minimal so it works even when the main CSS
         bundle hasn't downloaded yet. -->
    <div id="root">
      <div
        id="canvhub-boot-fallback"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          padding: 24px;
          background: #1c1c1c;
          color: #f5f3ee;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            &quot;Helvetica Neue&quot;, Arial, sans-serif;
          text-align: center;
        "
      >
        <div
          aria-hidden="true"
          style="
            width: 36px;
            height: 36px;
            border: 3px solid rgba(245, 243, 238, 0.18);
            border-top-color: #f5f3ee;
            border-radius: 50%;
            animation: canvhub-boot-spin 0.9s linear infinite;
          "
        ></div>
        <div
          style="
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.7;
          "
        >
          Canvas Hub
        </div>
        <noscript>
          <p style="max-width: 32ch; opacity: 0.85; font-size: 13px">
            Canvas Hub needs JavaScript to run. Please enable it in your browser
            settings and reload this page.
          </p>
        </noscript>
      </div>
      <style>
        @keyframes canvhub-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <!-- Diagnostic overlay. Watches for two failure modes that would
         otherwise paint a totally blank page on devices where the SPA
         can't mount:
           1. an uncaught error / unhandled rejection during boot, OR
           2. the SPA never replacing #root within 25 s (a silent stall,
              e.g. a syntax-error parse fail on an older Android Chrome).
         Logic lives in /public/boot-diagnostics.js so it can be served
         from the same origin (our CSP forbids inline `<script>`). Loaded
         before the SPA's module script so it can catch errors from the
         very first failed import.
         The `?v=` query string is a manual cache-buster. We also send
         `Cache-Control: max-age=0, must-revalidate` for this URL (see
         `public/_headers`), but if a visitor already cached an older
         version under the default 4 h CDN policy bumping `v` is the
         only way to force their phone to fetch the new one. Bump it
         whenever the diagnostic script materially changes (new
         checkpoints, new failure modes, etc.). -->
    <script src="/boot-diagnostics.js?v=4"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
