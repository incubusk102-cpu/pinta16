<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Canvas Hub — Affordable Art Gallery</title>
    <meta
      name="description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvas Hub" />
    <meta property="og:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      property="og:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta property="og:url" content="https://canvhub.com/" />
    <meta property="og:image" content="https://canvhub.com/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canvas Hub — Affordable Art Gallery" />
    <meta
      name="twitter:description"
      content="Discover hand-crafted paintings that transform spaces. Original art, made to order."
    />
    <meta name="twitter:image" content="https://canvhub.com/icon-512.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Canvas Hub" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts — preconnect to start the TLS handshake to
         fonts.gstatic.com in parallel with the HTML download, then
         load the stylesheet. Previously imported via an @import inside
         the Tailwind-built stylesheet, which serialises behind the CSS
         download. `display=swap` keeps text legible while the woff2s
         load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- Splash screen styles. Loaded as an external sheet so the
         document's CSP can drop `'unsafe-inline'` from `style-src`
         in a follow-up without behaviour changes. -->
    <link rel="stylesheet" href="/splash.css" />

    <!-- Structured data for Google. `<script type="application/ld+json">`
         is treated as data, not script, by browsers, so it is not
         subject to `script-src` CSP enforcement. Two top-level entities:
           - Organization: who runs the site, contact, country.
           - WebSite:      site search box on Google SERPs.
         Per-page schema (Product, BreadcrumbList) is emitted by the
         relevant route components. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://canvhub.com/#organization",
            "name": "Canvas Hub",
            "url": "https://canvhub.com/",
            "logo": "https://canvhub.com/icon-512.png",
            "image": "https://canvhub.com/icon-512.png",
            "description": "Hand-crafted paintings and original art shipped from the Philippines, made to order.",
            "email": "support@canvhub.com",
            "areaServed": "PH",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PH"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@canvhub.com",
              "availableLanguage": ["English", "Filipino"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://canvhub.com/#website",
            "url": "https://canvhub.com/",
            "name": "Canvas Hub",
            "publisher": { "@id": "https://canvhub.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Canvas Hub">
      <svg
        viewBox="0 0 512 512"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <!-- Faint background ring (static visual frame) -->
        <circle
          cx="256"
          cy="256"
          r="220"
          fill="none"
          stroke="#c4a86a"
          stroke-width="3"
          stroke-opacity="0.12"
        />
        <!-- Rotating italic C from EB Garamond, gold fill.
             SMIL animateTransform rotates 360deg around viewBox center
             (256, 256) every 1.8s. -->
        <g>
          <animateTransform
            attributeName="transform"
            attributeType="XML"
            type="rotate"
            from="0 256 256"
            to="360 256 256"
            dur="1.8s"
            repeatCount="indefinite"
          />
          <g transform="translate(53 422) scale(0.50 -0.50)" fill="#c4a86a">
            <path
              d="M384 -14C435 -14 452 11 472 11C492 11 502 -11 512 -9C523 -7 576 115 576 138C576 149 575 157 569 157C564 157 558 149 552 139C513 76 465 23 402 23C294 23 180 110 180 228C180 432 326 628 519 628C558 628 596 616 613 593C634 565 628 523 622 493C620 481 625 467 637 467C644 467 653 477 655 487C664 532 700 599 722 629C726 634 727 645 715 645C700 645 684 629 672 629C662 629 610 663 529 663C293 663 96 494 96 240C96 90 234 -14 384 -14Z"
            />
          </g>
        </g>
      </svg>
    </div>
    <!-- Splash safety-net + reduced-motion handling. Extracted from
         a previous inline <script> so the document's CSP can drop
         `'unsafe-inline'` from `script-src` in a follow-up without
         behaviour changes. Classic script (no defer/async) so it
         runs synchronously while the parser is still emitting the
         body — same timing as the previous inline block. -->
    <script src="/splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
